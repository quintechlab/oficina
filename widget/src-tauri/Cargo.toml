[package]
name = "oficina-widget"
version = "0.16.0"
description = "Widget de escritorio de la oficina"
edition = "2021"
license = "MIT"

[lib]
name = "oficina_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
# El selector de carpetas de la charla con la mascota (#22, D10), solo desde Rust
tauri-plugin-dialog = "2"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# Resumen con IA (#11): la descarga del modelo (con Range) y las llamadas al motor en 127.0.0.1.
# Sin gzip: los archivos se bajan tal cual, byte a byte, para poder retomarlos y verificarlos
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
sha2 = "0.10"
# El token del servidor de la charla (#43, chat-herramientas-ux.md 11.1): el generador del sistema. La
# misma versión que ya estaba en Cargo.lock (0.3.4, de otras dependencias): no baja nada nuevo
getrandom = "0.3"

# Claves de API (#23, configuracion-ux.md 9.4): CredWriteW/CredReadW/CredDeleteW del Administrador de
# credenciales de Windows. La misma versión que ya trae Tauri (0.61.2 en Cargo.lock): solo suma features.
# Threading: OpenProcess/GetProcessTimes/TerminateProcess para terminar una sesión dormida (terminar.rs)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_System_Threading"] }

# Desarrollo: los errores siguen diciendo archivo y línea, sin la info de depuración completa
[profile.dev]
debug = "line-tables-only"

# Las dependencias (cientos, por Tauri) sin info de depuración: es lo que más pesa en target/debug
[profile.dev.package."*"]
debug = false
