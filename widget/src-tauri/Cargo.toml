[package]
name = "oficina-widget"
version = "0.1.0"
description = "Widget de escritorio de la oficina"
edition = "2021"
license = "MIT"

[lib]
name = "oficina_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
