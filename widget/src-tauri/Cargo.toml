[package]
name = "oficina-widget"
version = "0.5.0"
description = "Widget de escritorio de la oficina"
edition = "2021"
license = "MIT"

[lib]
name = "oficina_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# Desarrollo: los errores siguen diciendo archivo y línea, sin la info de depuración completa
[profile.dev]
debug = "line-tables-only"

# Las dependencias (cientos, por Tauri) sin info de depuración: es lo que más pesa en target/debug
[profile.dev.package."*"]
debug = false
