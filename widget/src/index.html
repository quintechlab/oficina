<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Avis</title>
<link rel="preload" href="fuentes/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fuentes/martian-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="estilos.css">
<link rel="stylesheet" href="avis.css">
<link rel="stylesheet" href="especies.css">
<script type="module" src="main.js"></script>
</head>
<body>
  <!-- Tablero (estilo Avis, opción A): la ventana es transparente y #marco pinta el fondo -->
  <div id="marco" class="cargando">
    <div class="desplaza" id="cuerpo">
      <!-- El tamaño natural de este bloque decide el del tablero (tamano.js); la ventana es el área -->
      <div id="contenido">
        <aside class="lado">
          <!-- Marca "Escenario" (docs/diseno/marca-avi-ux.md): el Avi de Claude de 112 sobre su luz; marcaMotion.js lo mueve -->
          <!-- El Avi es además el botón de la charla (docs/diseno/chat-avis-ux.md 3.2): arrastrar desde él sigue moviendo el tablero -->
          <div class="marca" data-arrastre title="Arrastrá para mover o acoplar a un borde">
            <button type="button" id="marca-boton" class="avi-btn" aria-label="Charlar con Avi" aria-describedby="marca-animo" aria-expanded="false" aria-controls="hoja" title="Charlar con Avi">
              <span id="marca-avi" aria-hidden="true"></span>
              <span id="marca-animo" class="oculto"></span>
            </button>
            <!-- Con la hoja abierta la mascota se mudó a su escenario: queda su fantasma -->
            <span class="mudada" aria-hidden="true"><i></i>en la charla →</span>
            <b class="marca-n">Avis</b>
            <span class="estado" id="marca-estado"></span>
          </div>
          <!-- Pantalla dividida (docs/diseno/dividida-ux.md 5.9): una ficha por conversación entre sesiones, solo si hay -->
          <section class="conversan-s" id="conversan" aria-labelledby="h-conversan" hidden></section>
          <nav class="proyectos" aria-labelledby="h-proyectos">
            <h2 class="oculto" id="h-proyectos">Proyectos</h2>
            <div id="proyectos"></div>
          </nav>
          <section class="lado-pie" aria-labelledby="h-equipo">
            <h2 class="rot" id="h-equipo">Equipo</h2>
            <div id="equipo"></div>
            <p class="pie-w" id="pie" role="status"></p>
          </section>
        </aside>
        <!-- El riel de 56 de la pantalla dividida (dividida-ux.md 5.1): en lugar de la barra mientras dos sesiones conversan -->
        <aside class="riel" id="riel"></aside>
        <main class="principal">
          <header class="cab">
            <div class="cab-t" data-arrastre title="Arrastrá para mover o acoplar a un borde">
              <h1 id="titulo"></h1>
              <p id="subtitulo"></p>
            </div>
            <!-- Encabezado de la conversación (dividida-ux.md 5.2): kick, título y sub, y la salida "‹ vista anterior" -->
            <div class="cab-c-t" id="cab-conv" data-arrastre title="Arrastrá para mover o acoplar a un borde"></div>
            <button type="button" class="volver" id="volver" data-accion="volver"></button>
            <div class="controles">
              <button type="button" class="tb" data-accion="pin" aria-pressed="true" aria-label="Siempre arriba" title="Siempre arriba">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 2h5M6.5 2v4.2L4.5 8.5h7L9.5 6.2V2M8 8.5V14"/></svg>
              </button>
              <button type="button" class="tb" data-accion="mini" aria-label="Minimizar a la tira" title="Minimizar a la tira">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10"/></svg>
              </button>
              <button type="button" class="tb" data-accion="cerrar" aria-label="Cerrar a la bandeja" title="Cerrar a la bandeja">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
              </button>
            </div>
            <!-- La cuenta de la vuelta (dividida-ux.md 9.4): una barra de 2 px que se vacía en 60 s -->
            <span class="drena" id="drena" aria-hidden="true"><i></i></span>
          </header>
          <div id="vacio-avi" class="vacio-avi" hidden></div>
          <div id="otro"></div>
          <!-- Pantalla dividida: pestañas (2 o más conversaciones), las dos mitades con su puente y la ficha "Último" -->
          <div id="pestanas"></div>
          <section class="split" id="split" aria-labelledby="h-split">
            <h2 class="oculto" id="h-split">Las dos sesiones</h2>
            <div class="split-g" id="split-g"></div>
            <div id="puente"></div>
          </section>
          <div class="ficha-u" id="ficha-u"></div>
          <div id="w-globo"></div>
          <!-- Primeros pasos (docs/diseno/bienvenida-ux.md): el escenario en lugar del vacío o la hoja de la columna -->
          <div id="pp"></div>
          <div class="conteos" id="conteos"></div>
          <section class="sesiones" aria-labelledby="h-sesiones">
            <h2 class="oculto" id="h-sesiones">Sesiones</h2>
            <div id="sesiones"></div>
          </section>
        </main>
      </div>
    </div>
  </div>
  <!-- La charla con la mascota (docs/diseno/chat-avis-ux.md 3.2): una hoja al lado del tablero, hermana de
       #marco (así el tamaño del tablero no cambia). main.js la ubica (--hx, --hy, --hw, --hh) y chatVista.js
       dibuja sus partes; el campo no se redibuja nunca (lo escrito no se pierde) -->
  <section id="hoja" class="hoja" aria-label="Charla con Avi" hidden>
    <div class="escenario" data-arrastre title="Arrastrá para mover o acoplar a un borde">
      <div class="arriba">
        <button type="button" class="ic" data-accion="ch-hist" aria-label="Historial" aria-expanded="false" title="Historial">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 4.8V8l2.2 1.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
        <button type="button" class="ic" data-accion="ch-cerrar" aria-label="Cerrar la charla" title="Cerrar la charla">
          <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
      <i class="destello" aria-hidden="true"></i>
      <div id="chat-avi" class="voz"></div>
      <b class="esc-nom" id="chat-nom"></b>
      <span class="esc-est" id="chat-est"></span>
    </div>
    <div class="charla">
      <div class="ch-cab" id="chat-cab"></div>
      <div id="chat-hilo" class="hilo" role="log" aria-live="off" tabindex="0" aria-label="Conversación"></div>
      <div class="comp">
        <div class="adjuntos" id="chat-adjuntos"></div>
        <div class="campo">
          <button type="button" class="ic" id="chat-clip" data-accion="ch-adjuntar" aria-label="Adjuntar archivo" title="Adjuntar archivo">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10.5 4.5 5.6 9.4a1.4 1.4 0 0 0 2 2l5-5a2.8 2.8 0 0 0-4-4l-5 5a4.2 4.2 0 0 0 6 6l4.4-4.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </button>
          <textarea id="chat-campo" rows="1" aria-label="Mensaje para Avi" placeholder="Preguntale a Avi…"></textarea>
          <span id="chat-boton" class="boton"></span>
        </div>
        <div class="pie-comp"><span id="chat-pista"></span><span id="chat-pie"></span></div>
      </div>
      <div id="chat-menu" hidden></div>
      <div id="chat-soltar"></div>
    </div>
    <div id="chat-cajon-lugar"></div>
    <p class="oculto" id="anuncio-chat" aria-live="polite" aria-atomic="true"></p>
  </section>
  <!-- Muesca acoplada (sección 7): el único control mientras está cerrada. El panel es #marco -->
  <!-- Muesca A "Asoma" (docs/diseno/muesca-avi-ux.md): main.js escribe su armazón una vez (contenidoMuesca) -->
  <button type="button" id="muesca" aria-expanded="false" aria-controls="marco" aria-label="Avis. Abrir"></button>
  <div id="luz" aria-hidden="true"></div>
  <!-- Píldora al arrastrar la muesca lejos de los bordes, y aviso del imán al arrastrar el tablero (7.3) -->
  <div id="pildora" aria-hidden="true"></div>
  <p id="aviso-iman" aria-hidden="true"></p>
  <!-- Anuncia una sola vez cada pregunta que llega (dirección 8); nunca mueve el foco -->
  <p class="oculto" id="anuncio" aria-live="polite"></p>
  <!-- Tira mini (400 × 56): caras, resumen, preguntas, expandir y cerrar -->
  <div class="tira" id="tira" hidden>
    <div class="arrastre" data-arrastre title="Arrastrá para mover o acoplar a un borde">
      <span class="caras" id="tira-caras"></span>
      <span class="resumen" id="tira-resumen"></span>
    </div>
    <span id="tira-pend"></span>
    <button type="button" class="tb" data-accion="expandir" aria-label="Expandir" title="Expandir">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5h9v9h-9z"/></svg>
    </button>
    <button type="button" class="tb" data-accion="cerrar" aria-label="Cerrar a la bandeja" title="Cerrar a la bandeja">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
    </button>
  </div>
</body>
</html>
