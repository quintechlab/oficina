<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oficina</title>
<link rel="stylesheet" href="estilos.css">
<script type="module" src="main.js"></script>
</head>
<body>
  <header class="titulo" id="titulo">
    <div class="arrastre" data-tauri-drag-region title="Arrastrá para mover">
      <span id="t-mascota" class="t-mascota"></span>
      <span class="marca">Oficina<small>Quintech</small></span>
      <span id="t-pend"></span>
    </div>
    <button type="button" class="tb" data-accion="pin" aria-pressed="true" aria-label="Siempre arriba" title="Siempre arriba">
      <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M5 1h4v1h1v4h1v2H3V6h1V2h1zM6 8h2v5H6z" fill="currentColor"/></svg>
    </button>
    <button type="button" class="tb" data-accion="mini" aria-label="Minimizar a la tira" title="Minimizar">
      <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 7h10v1H2z" fill="currentColor"/></svg>
    </button>
    <button type="button" class="tb cerrar" data-accion="cerrar" aria-label="Cerrar a la bandeja" title="Cerrar a la bandeja">
      <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2h2v1h1v1h1v1h2V4h1V3h1V2h2v2h-1v1h-1v1H9v2h1v1h1v1h1v2h-2v-1H9v-1H8V9H6v1H5v1H4v1H2v-2h1V9h1V8h1V6H4V5H3V4H2z" fill="currentColor"/></svg>
    </button>
  </header>
  <!-- Tira mini (400 × 56): caras, resumen, expandir y cerrar -->
  <header class="titulo tira" id="tira" hidden>
    <div class="arrastre" data-tauri-drag-region title="Arrastrá para mover">
      <span class="caras" id="tira-caras"></span>
      <span class="resumen" id="tira-resumen"></span>
    </div>
    <span id="tira-pend"></span>
    <button type="button" class="tb" data-accion="expandir" aria-label="Expandir" title="Expandir">
      <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2h10v10H2zM3 4v7h8V4z" fill="currentColor" fill-rule="evenodd"/></svg>
    </button>
    <button type="button" class="tb cerrar" data-accion="cerrar" aria-label="Cerrar a la bandeja" title="Cerrar a la bandeja">
      <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2h2v1h1v1h1v1h2V4h1V3h1V2h2v2h-1v1h-1v1H9v2h1v1h1v1h1v2h-2v-1H9v-1H8V9H6v1H5v1H4v1H2v-2h1V9h1V8h1V6H4V5H3V4H2z" fill="currentColor"/></svg>
    </button>
  </header>
  <main class="cuerpo-w" id="cuerpo">
    <!-- El tamaño natural de este bloque decide el de la ventana (tamano.js) -->
    <div id="contenido">
      <p class="rot"><i>▍</i> Tus proyectos<span id="total"></span></p>
      <div id="nav"></div>
      <div id="otro"></div>
      <div id="w-globo"></div>
      <div class="escena" id="escena"></div>
      <div id="lista"></div>
      <div id="equipo"></div>
      <p class="pie-w" id="pie" role="status"></p>
    </div>
  </main>
</body>
</html>
