<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Avis</title>
<link rel="preload" href="fuentes/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fuentes/martian-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="estilos.css">
<link rel="stylesheet" href="avis.css">
<script type="module" src="main.js"></script>
</head>
<body>
  <!-- Tablero (estilo Avis, opción A): la ventana es transparente y #marco pinta el fondo -->
  <div id="marco" class="cargando">
    <div class="desplaza" id="cuerpo">
      <!-- El tamaño natural de este bloque decide el del tablero (tamano.js); la ventana es el área -->
      <div id="contenido">
        <aside class="lado">
          <!-- Marca "Escenario" (docs/diseno/marca-avi-ux.md): el Avi de Claude de 112 sobre su luz; marcaMotion.js lo mueve -->
          <div class="marca" data-arrastre title="Arrastrá para mover o acoplar a un borde">
            <span id="marca-avi"></span>
            <b class="marca-n">Avis</b>
            <span class="estado" id="marca-estado"></span>
          </div>
          <nav class="proyectos" aria-labelledby="h-proyectos">
            <h2 class="oculto" id="h-proyectos">Proyectos</h2>
            <div id="proyectos"></div>
          </nav>
          <section class="lado-pie" aria-labelledby="h-equipo">
            <h2 class="rot" id="h-equipo">Equipo</h2>
            <div id="equipo"></div>
            <p class="pie-w" id="pie" role="status"></p>
          </section>
        </aside>
        <main class="principal">
          <header class="cab">
            <div class="cab-t" data-arrastre title="Arrastrá para mover o acoplar a un borde">
              <h1 id="titulo"></h1>
              <p id="subtitulo"></p>
            </div>
            <div class="controles">
              <button type="button" class="tb" data-accion="pin" aria-pressed="true" aria-label="Siempre arriba" title="Siempre arriba">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 2h5M6.5 2v4.2L4.5 8.5h7L9.5 6.2V2M8 8.5V14"/></svg>
              </button>
              <button type="button" class="tb" data-accion="mini" aria-label="Minimizar a la tira" title="Minimizar a la tira">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10"/></svg>
              </button>
              <button type="button" class="tb" data-accion="cerrar" aria-label="Cerrar a la bandeja" title="Cerrar a la bandeja">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
              </button>
            </div>
          </header>
          <div id="vacio-avi" class="vacio-avi" hidden></div>
          <div id="otro"></div>
          <div id="w-globo"></div>
          <!-- Primeros pasos (docs/diseno/bienvenida-ux.md): el escenario en lugar del vacío o la hoja de la columna -->
          <div id="pp"></div>
          <div class="conteos" id="conteos"></div>
          <section class="sesiones" aria-labelledby="h-sesiones">
            <h2 class="oculto" id="h-sesiones">Sesiones</h2>
            <div id="sesiones"></div>
          </section>
        </main>
      </div>
    </div>
  </div>
  <!-- Muesca acoplada (sección 7): el único control mientras está cerrada. El panel es #marco -->
  <!-- Muesca A "Asoma" (docs/diseno/muesca-avi-ux.md): main.js escribe su armazón una vez (contenidoMuesca) -->
  <button type="button" id="muesca" aria-expanded="false" aria-controls="marco" aria-label="Avis. Abrir"></button>
  <div id="luz" aria-hidden="true"></div>
  <!-- Píldora al arrastrar la muesca lejos de los bordes, y aviso del imán al arrastrar el tablero (7.3) -->
  <div id="pildora" aria-hidden="true"></div>
  <p id="aviso-iman" aria-hidden="true"></p>
  <!-- Anuncia una sola vez cada pregunta que llega (dirección 8); nunca mueve el foco -->
  <p class="oculto" id="anuncio" aria-live="polite"></p>
  <!-- Tira mini (400 × 56): caras, resumen, preguntas, expandir y cerrar -->
  <div class="tira" id="tira" hidden>
    <div class="arrastre" data-arrastre title="Arrastrá para mover o acoplar a un borde">
      <span class="caras" id="tira-caras"></span>
      <span class="resumen" id="tira-resumen"></span>
    </div>
    <span id="tira-pend"></span>
    <button type="button" class="tb" data-accion="expandir" aria-label="Expandir" title="Expandir">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5h9v9h-9z"/></svg>
    </button>
    <button type="button" class="tb" data-accion="cerrar" aria-label="Cerrar a la bandeja" title="Cerrar a la bandeja">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
    </button>
  </div>
</body>
</html>
