<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Avis</title>
<link rel="preload" href="fuentes/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fuentes/martian-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="estilos.css">
<link rel="stylesheet" href="avis.css">
<link rel="stylesheet" href="especies.css">
<script type="module" src="main.js"></script>
</head>
<body>
  <!-- Tablero (estilo Avis, opción A): la ventana es transparente y #marco pinta el fondo -->
  <div id="marco" class="cargando mod-sesiones">
    <div class="desplaza" id="cuerpo">
      <!-- El tamaño natural de este bloque decide el del tablero (tamano.js); la ventana es el área -->
      <div id="contenido">
        <aside class="lado">
          <!-- Marca "Escenario" (docs/diseno/marca-avi-ux.md): el Avi de Claude de 112 sobre su luz; marcaMotion.js lo mueve -->
          <!-- El Avi es además el botón de la charla (docs/diseno/chat-avis-ux.md 3.2): arrastrar desde él sigue moviendo el tablero -->
          <div class="marca" data-arrastre title="Arrastrá para mover o acoplar a un borde">
            <button type="button" id="marca-boton" class="avi-btn" aria-label="Charlar con Avi" aria-describedby="marca-animo" aria-expanded="false" aria-controls="hoja" title="Charlar con Avi">
              <span id="marca-avi" aria-hidden="true"></span>
              <span id="marca-animo" class="oculto"></span>
            </button>
            <!-- Con la hoja abierta la mascota se mudó a su escenario: queda su fantasma -->
            <span class="mudada" aria-hidden="true"><i></i>en la charla →</span>
            <b class="marca-n">Avis</b>
            <span class="estado" id="marca-estado"></span>
          </div>
          <!-- Pantalla dividida (docs/diseno/dividida-ux.md 5.9): una ficha por conversación entre sesiones, solo si hay -->
          <section class="conversan-s" id="conversan" aria-labelledby="h-conversan" hidden></section>
          <!-- Menú de módulos (docs/diseno/modulos-ux.md 3.3 y 4.1, #42): Sesiones, Tareas (y Hábitos con #41); la píldora
               ámbar (.ind-mod) viaja a la fila abierta (aria-current="page"). Las cuentas (#…-ct) y los nombres los pone
               main.js (cuentaModulo, nombreModulo). Desde M2 los proyectos están en la tira de repos de la columna (#repos) -->
          <nav class="mods" id="mods" aria-label="Módulos">
            <span class="ind-mod" aria-hidden="true"></span>
            <button type="button" class="mod" id="mod-sesiones" data-accion="mod" data-mod="sesiones" aria-keyshortcuts="Escape" title="Sesiones (Esc)" aria-label="Sesiones, buscando">
              <span class="mod-ic" aria-hidden="true"><svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="9" rx="2.6"/><path d="M5 14h6M6 7.2h.01M10 7.2h.01"/></svg></span>
              <span class="mod-n">Sesiones</span><span class="mod-ct" id="mod-sesiones-ct"><span class="cuentas" aria-hidden="true"><span class="chip">…</span></span></span>
            </button>
            <!-- Tareas (docs/diseno/tareas-ux.md 4.1): la cuenta de hoy + vencidas o la pista "Ctrl T" (#tar-fila-ct, tareasVista.js) -->
            <button type="button" class="mod tar" id="tar-fila" data-accion="mod" data-mod="tareas" aria-keyshortcuts="Control+T" title="Tareas (Ctrl T)" aria-label="Tareas">
              <span class="mod-ic" aria-hidden="true"><svg viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="11" height="11" rx="3.2"/><path class="tilde-p" d="M5.3 8.2l1.9 1.9 3.6-4"/></svg></span>
              <span class="mod-n">Tareas</span><span class="mod-ct tar-ct" id="tar-fila-ct"><kbd aria-hidden="true">Ctrl T</kbd></span>
            </button>
            <!-- Hábitos (#41, docs/diseno/habitos-ux.md 4.1): la pista "Ctrl H", «—» o el anillo de hoy con «{h}/{t}» (#hab-fila-ct, habitosVista.js) -->
            <button type="button" class="mod hab" id="hab-fila" data-accion="mod" data-mod="habitos" aria-keyshortcuts="Control+H" title="Hábitos (Ctrl H)" aria-label="Hábitos">
              <span class="mod-ic" aria-hidden="true"><svg viewBox="0 0 16 16"><path class="arco" d="M13.2 8.6A5.2 5.2 0 1 1 11.6 4.2"/><path d="M12.2 1.8v2.8H9.4"/><circle cx="8" cy="8.3" r="1.5" fill="currentColor" stroke="none"/></svg></span>
              <span class="mod-n">Hábitos</span><span class="mod-ct hab-ct" id="hab-fila-ct"><kbd aria-hidden="true">Ctrl H</kbd></span>
            </button>
            <!-- Proyectos (#44, docs/diseno/proyectos-ux.md 4.1): la pista "Ctrl P" o el número de proyectos, con el punto rojo si alguno perdió su carpeta (#pro-fila-ct, proyectosVista.js) -->
            <button type="button" class="mod pro" id="pro-fila" data-accion="mod" data-mod="proyectos" aria-keyshortcuts="Control+P" title="Proyectos (Ctrl P)" aria-label="Proyectos">
              <span class="mod-ic" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M2.5 5.2V12a1.5 1.5 0 0 0 1.5 1.5h8a1.5 1.5 0 0 0 1.5-1.5V6.5A1.5 1.5 0 0 0 12 5H8L6.6 3.2H4A1.5 1.5 0 0 0 2.5 4.7z"/></svg></span>
              <span class="mod-n">Proyectos</span><span class="mod-ct pro-ct" id="pro-fila-ct"><kbd aria-hidden="true">Ctrl P</kbd></span>
            </button>
            <!-- Horas (odd/tasks/horas-trabajo.md, S4): lo trabajado hoy, corto (#hor-fila-ct, cuentaModulo); sin atajo -->
            <button type="button" class="mod hor" id="hor-fila" data-accion="mod" data-mod="horas" title="Horas" aria-label="Horas">
              <span class="mod-ic" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M4.5 2h7M4.5 14h7"/><path d="M5.3 2.2c0 3 5.4 3.4 5.4 5.8s-5.4 2.8-5.4 5.8M10.7 2.2c0 3-5.4 3.4-5.4 5.8s5.4 2.8 5.4 5.8"/><path class="arena" d="M8 8.6v3.4"/></svg></span>
              <span class="mod-n">Horas</span><span class="mod-ct hor-fila-ct" id="hor-fila-ct"></span>
            </button>
          </nav>
          <!-- Configuración (docs/diseno/configuracion-ux.md 4.1, modulos-ux.md 3.3): sola y aparte, pegada al pie de lo que se
               ve: en una pantalla baja la barra desplaza y la fila no se pierde (16, D-g). La píldora no baja hasta acá: abierta, pone su fondo -->
          <div class="lado-cfg">
            <button type="button" class="mod engr" id="cfg-fila" data-accion="mod" data-mod="config" aria-keyshortcuts="Control+Comma" title="Configuración (Ctrl ,)" aria-label="Configuración">
              <span class="mod-ic" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M13.14 6.72L14.93 7.01L14.93 8.99L13.14 9.28L12.54 10.73L13.60 12.20L12.20 13.60L10.73 12.54L9.28 13.14L8.99 14.93L7.01 14.93L6.72 13.14L5.27 12.54L3.80 13.60L2.40 12.20L3.46 10.73L2.86 9.28L1.07 8.99L1.07 7.01L2.86 6.72L3.46 5.27L2.40 3.80L3.80 2.40L5.27 3.46L6.72 2.86L7.01 1.07L8.99 1.07L9.28 2.86L10.73 3.46L12.20 2.40L13.60 3.80L12.54 5.27Z"/><circle cx="8" cy="8" r="2.1"/></svg></span>
              <span class="mod-n">Configuración</span><span class="mod-ct" id="cfg-fila-ct"><kbd aria-hidden="true">Ctrl ,</kbd></span>
            </button>
          </div>
          <section class="lado-pie" aria-labelledby="h-equipo">
            <h2 class="rot" id="h-equipo">Equipo</h2>
            <div id="equipo"></div>
            <p class="pie-w" id="pie" role="status"></p>
          </section>
        </aside>
        <!-- El riel de 56 de la pantalla dividida (dividida-ux.md 5.1): en lugar de la barra mientras dos sesiones conversan -->
        <aside class="riel" id="riel"></aside>
        <main class="principal">
          <header class="cab">
            <div class="cab-t" data-arrastre title="Arrastrá para mover o acoplar a un borde">
              <!-- La mascota de 40 junto al título, con la configuración abierta fuera de Mascota (configuracion-ux.md 6.1) -->
              <span class="cfg-mini" id="cfg-mini" aria-hidden="true"></span>
              <!-- La mascota de 40 junto al título con la hoja de Tareas abierta (tareas-ux.md 4.10): festeja cada tilde -->
              <span class="tar-mini" id="tar-mini" aria-hidden="true"></span>
              <!-- La mascota de 40 junto al título con la hoja de Hábitos abierta (habitos-ux.md 4.13): festeja cada marca -->
              <span class="hab-mini" id="hab-mini" aria-hidden="true"></span>
              <h1 id="titulo" tabindex="-1"></h1>
              <p id="subtitulo"></p>
            </div>
            <!-- Encabezado de la conversación (dividida-ux.md 5.2): kick, título y sub, y la salida "‹ vista anterior" -->
            <div class="cab-c-t" id="cab-conv" data-arrastre title="Arrastrá para mover o acoplar a un borde"></div>
            <button type="button" class="volver" id="volver" data-accion="volver"></button>
            <div class="controles">
              <button type="button" class="tb" data-accion="pin" aria-pressed="true" aria-label="Siempre arriba" title="Siempre arriba">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 2h5M6.5 2v4.2L4.5 8.5h7L9.5 6.2V2M8 8.5V14"/></svg>
              </button>
              <button type="button" class="tb" data-accion="mini" aria-label="Minimizar a la tira" title="Minimizar a la tira">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10"/></svg>
              </button>
              <button type="button" class="tb" data-accion="cerrar" aria-label="Cerrar a la bandeja" title="Cerrar a la bandeja">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
              </button>
            </div>
            <!-- La cuenta de la vuelta (dividida-ux.md 9.4): una barra de 2 px que se vacía en 60 s -->
            <span class="drena" id="drena" aria-hidden="true"><i></i></span>
          </header>
          <!-- La pregunta vista desde otro módulo (modulos-ux.md 4.5, #42): una pregunta pendiente nunca se pierde -->
          <div id="aviso-p"></div>
          <div id="vacio-avi" class="vacio-avi" hidden></div>
          <!-- Configuración (docs/diseno/configuracion-ux.md 4.2): la hoja reemplaza a lo de abajo mientras está abierta -->
          <div id="cfg"></div>
          <!-- Tareas (docs/diseno/tareas-ux.md 3.2): hermana de #cfg, una hoja por vez en la columna -->
          <div id="tar"></div>
          <!-- Hábitos (docs/diseno/habitos-ux.md 3.2): hermana de #cfg y #tar, una hoja por vez en la columna -->
          <div id="hab"></div>
          <!-- Proyectos (docs/diseno/proyectos-ux.md 3.2): hermana de #cfg, #tar y #hab, una hoja por vez en la columna -->
          <div id="pro"></div>
          <!-- Horas (odd/tasks/horas-trabajo.md, S4): hermana de #cfg, #tar, #hab y #pro, una hoja por vez en la columna -->
          <div id="hor"></div>
          <!-- La tira de repos (modulos-ux.md 4.4, #42 M2): un chip por proyecto, solo en Sesiones (tablero.js, tiraRepos).
               Se llama «Repos»: «Proyectos» es un módulo nuevo (#44). Con muchos repos (tira-repos-ux.md, opción A):
               hasta dos renglones y el «+n», que abre #repos-mas; la lista va fuera del nav, así #repos [data-proy] son solo chips -->
          <div class="repos-caja">
            <nav class="repos" id="repos" aria-label="Repos"></nav>
            <div id="repos-mas" role="listbox" hidden></div>
          </div>
          <div id="otro"></div>
          <!-- El aviso diario de tareas en la pantalla dividida (tareas-ux.md 8.4): la fila arriba de las sesiones -->
          <div id="aviso-tar"></div>
          <!-- Pantalla dividida: pestañas (2 o más conversaciones), las dos mitades con su puente y la ficha "Último" -->
          <div id="pestanas"></div>
          <section class="split" id="split" aria-labelledby="h-split">
            <h2 class="oculto" id="h-split">Las dos sesiones</h2>
            <div class="split-g" id="split-g"></div>
            <div id="puente"></div>
          </section>
          <div class="ficha-u" id="ficha-u"></div>
          <div id="w-globo"></div>
          <!-- Primeros pasos (docs/diseno/bienvenida-ux.md): el escenario en lugar del vacío o la hoja de la columna -->
          <div id="pp"></div>
          <div class="conteos" id="conteos"></div>
          <section class="sesiones" aria-labelledby="h-sesiones">
            <h2 class="oculto" id="h-sesiones">Sesiones</h2>
            <div id="sesiones"></div>
          </section>
        </main>
      </div>
    </div>
  </div>
  <!-- La charla con la mascota (docs/diseno/chat-avis-ux.md 3.2): una hoja al lado del tablero, hermana de
       #marco (así el tamaño del tablero no cambia). main.js la ubica (--hx, --hy, --hw, --hh) y chatVista.js
       dibuja sus partes; el campo no se redibuja nunca (lo escrito no se pierde) -->
  <section id="hoja" class="hoja" aria-label="Charla con Avi" hidden>
    <div class="escenario" data-arrastre title="Arrastrá para mover o acoplar a un borde">
      <div class="arriba">
        <button type="button" class="ic" data-accion="ch-hist" aria-label="Historial" aria-expanded="false" title="Historial">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 4.8V8l2.2 1.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
        <button type="button" class="ic" data-accion="ch-cerrar" aria-label="Cerrar la charla" title="Cerrar la charla">
          <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
      <i class="destello" aria-hidden="true"></i>
      <div id="chat-avi" class="voz"></div>
      <b class="esc-nom" id="chat-nom"></b>
      <span class="esc-est" id="chat-est"></span>
    </div>
    <div class="charla">
      <div class="ch-cab" id="chat-cab"></div>
      <div id="chat-hilo" class="hilo" role="log" aria-live="off" tabindex="0" aria-label="Conversación"></div>
      <div class="comp">
        <div class="adjuntos" id="chat-adjuntos"></div>
        <div class="campo">
          <button type="button" class="ic" id="chat-clip" data-accion="ch-adjuntar" aria-label="Adjuntar archivo" title="Adjuntar archivo">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10.5 4.5 5.6 9.4a1.4 1.4 0 0 0 2 2l5-5a2.8 2.8 0 0 0-4-4l-5 5a4.2 4.2 0 0 0 6 6l4.4-4.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </button>
          <textarea id="chat-campo" rows="1" aria-label="Mensaje para Avi" placeholder="Preguntale a Avi…"></textarea>
          <span id="chat-boton" class="boton"></span>
        </div>
        <div class="pie-comp"><span id="chat-pista"></span><span id="chat-pie"></span></div>
      </div>
      <div id="chat-menu" hidden></div>
      <div id="chat-soltar"></div>
    </div>
    <div id="chat-cajon-lugar"></div>
    <p class="oculto" id="anuncio-chat" aria-live="polite" aria-atomic="true"></p>
  </section>
  <!-- Muesca acoplada (sección 7): el único control mientras está cerrada. El panel es #marco -->
  <!-- Muesca A "Asoma" (docs/diseno/muesca-avi-ux.md): main.js escribe su armazón una vez (contenidoMuesca) -->
  <button type="button" id="muesca" aria-expanded="false" aria-controls="marco" aria-label="Avis. Abrir"></button>
  <!-- El globo con la muesca plegada (tareas-ux.md 8.5 y habitos-ux.md 8.2): uno solo para el aviso de tareas y el
       recordatorio de un hábito, un botón hermano (#muesca ya es un botón). main.js le pone su acción (data-accion),
       lo ubica del lado de adentro (lugarGloboMuesca) y suma su rectángulo a la zona interactiva -->
  <button type="button" id="muesca-globo" data-accion="tar-globo" hidden></button>
  <div id="luz" aria-hidden="true"></div>
  <!-- Píldora al arrastrar la muesca lejos de los bordes, y aviso del imán al arrastrar el tablero (7.3) -->
  <div id="pildora" aria-hidden="true"></div>
  <p id="aviso-iman" aria-hidden="true"></p>
  <!-- Anuncia una sola vez cada pregunta que llega (dirección 8); nunca mueve el foco -->
  <p class="oculto" id="anuncio" aria-live="polite"></p>
  <!-- Tira mini (400 × 56): caras, resumen, preguntas, expandir y cerrar -->
  <div class="tira" id="tira" hidden>
    <div class="arrastre" data-arrastre title="Arrastrá para mover o acoplar a un borde">
      <span class="caras" id="tira-caras"></span>
      <span class="resumen" id="tira-resumen"></span>
    </div>
    <span id="tira-pend"></span>
    <!-- Las cuentas chicas de los módulos (modulos-ux.md 8, M2): las que entran sin dejar el resumen por debajo de 120 -->
    <span class="tira-mods" id="tira-mods"></span>
    <button type="button" class="tb" data-accion="expandir" aria-label="Expandir" title="Expandir">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5h9v9h-9z"/></svg>
    </button>
    <button type="button" class="tb" data-accion="cerrar" aria-label="Cerrar a la bandeja" title="Cerrar a la bandeja">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
    </button>
  </div>
</body>
</html>
